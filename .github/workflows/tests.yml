name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package without optional runtime dependencies
        run: python -m pip install --no-build-isolation -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI JSON smoke test
        run: laptop-inspector examples/sample_session.json --format json --output report.json
      - name: CLI HTML smoke test
        run: laptop-inspector examples/sample_session.json --format html --output report.html
