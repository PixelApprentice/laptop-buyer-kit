[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laptop-buyer-kit"
version = "0.1.0"
description = "Offline-first laptop inspection analysis engine and report generator"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Laptop Buyer Kit contributors"}]
dependencies = []

[project.scripts]
laptop-inspector = "laptop_inspector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
