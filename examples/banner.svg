<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid decoration lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Laptop Icon Graphic -->
  <g transform="translate(880, 80)" stroke="url(#primaryGrad)" stroke-width="4" fill="none">
    <rect x="0" y="0" width="220" height="140" rx="10" stroke-width="4" fill="#131b2e" />
    <path d="M -30 155 L 250 155 L 230 170 L -10 170 Z" fill="#1e293b" stroke-width="3" />
    <!-- Screen content lines -->
    <line x1="30" y1="40" x2="190" y2="40" stroke="#3b82f6" stroke-width="3" opacity="0.8" />
    <line x1="30" y1="65" x2="140" y2="65" stroke="#10b981" stroke-width="3" opacity="0.8" />
    <line x1="30" y1="90" x2="170" y2="90" stroke="#f59e0b" stroke-width="3" opacity="0.8" />
    <circle cx="110" cy="15" r="3" fill="#60a5fa" />
  </g>

  <!-- Tag Pill -->
  <g transform="translate(90, 65)">
    <rect width="180" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="18" cy="16" r="5" fill="#10b981" />
    <text x="32" y="21" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">VERSION 1.0.0 RELEASE</text>
  </g>

  <!-- Main Title -->
  <text x="90" y="150" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">Laptop Buyer Kit</text>

  <!-- Subtitle -->
  <text x="90" y="195" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">Offline-First Hardware Diagnostics &amp; Used-Laptop Buyer Assurance</text>

  <!-- Feature Pills -->
  <g transform="translate(90, 240)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="145" height="36" rx="8" fill="#131b2e" stroke="#2563eb" stroke-width="1.5" />
    <text x="18" y="23" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">🛡 100% Offline</text>

    <!-- Pill 2 -->
    <rect x="160" y="0" width="165" height="36" rx="8" fill="#131b2e" stroke="#10b981" stroke-width="1.5" />
    <text x="178" y="23" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">🔋 Battery Wear &amp; Cycles</text>

    <!-- Pill 3 -->
    <rect x="340" y="0" width="165" height="36" rx="8" fill="#131b2e" stroke="#f59e0b" stroke-width="1.5" />
    <text x="358" y="23" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">💾 NVMe SMART Logs</text>

    <!-- Pill 4 -->
    <rect x="520" y="0" width="175" height="36" rx="8" fill="#131b2e" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="538" y="23" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">⌨️ Interactive Testers</text>
  </g>
</svg>
